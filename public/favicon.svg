<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161621"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="area" x1="32" y1="18" x2="32" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#63eabe" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#63eabe" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="13.5" stroke="white" stroke-opacity="0.06" fill="none"/>

  <!-- Area fill under trend -->
  <path d="M12 44 L24 34 L36 28 L48 18 L52 50 L12 50 Z" fill="url(#area)"/>

  <!-- Trend line -->
  <path d="M12 44 L24 34 L36 28 L48 18"
        stroke="#63eabe" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Data point at peak -->
  <circle cx="48" cy="18" r="4" fill="#63eabe" opacity="0.15"/>
  <circle cx="48" cy="18" r="2.5" fill="#63eabe"/>
</svg>
